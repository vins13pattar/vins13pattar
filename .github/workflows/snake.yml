# Contribution snake animation
# Place this file at: .github/workflows/snake.yml  (in your vins13pattar profile repo)
#
# One-time setup after committing:
#   1. Repo Settings → Actions → General → Workflow permissions →
#      select "Read and write permissions" → Save
#   2. Actions tab → "generate snake animation" → Run workflow (first run)
#   The workflow writes the SVGs to an `output` branch, which the README references.

name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch: # manual trigger for the first run
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
